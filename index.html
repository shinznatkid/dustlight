<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dustlight</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23f2b56b%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mali:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass: rgba(28, 22, 18, 0.5);
      --glass-strong: rgba(30, 23, 18, 0.78);
      --glass-edge: rgba(255, 240, 220, 0.14);
      --ink: #f6ecdf;
      --ink-dim: rgba(246, 236, 223, 0.62);
      --accent: #f2b56b;
      --accent-ink: #2b1d10;
      --display: 'Mali', 'IBM Plex Sans Thai', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a241f; }
    body { font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    canvas { display: block; }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .glass {
      background: var(--glass); border: 1px solid var(--glass-edge);
      backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }
    .btn {
      font-size: 14px; padding: 9px 16px; border-radius: 12px; cursor: pointer;
      border: 1px solid var(--glass-edge); background: rgba(255, 255, 255, 0.08); color: var(--ink);
      transition: background 0.15s, transform 0.15s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.16); }
    .btn:active { transform: scale(0.98); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
    .btn.primary:hover { background: #f6c283; }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; cursor: pointer;
      padding: 0; border: 1px solid var(--glass-edge); background: var(--glass);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .icon-btn:hover { background: rgba(60, 46, 36, 0.7); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ---- screens are shown by body state ---- */
    .screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 5; }
    body.s-menu #menu, body.s-levels #levels, body.s-album #album, body.s-play #hud, body.s-photo #photoBar { opacity: 1; pointer-events: auto; }
    body.nohud .screen, body.nohud #toast { display: none; }
    #hud, #photoBar { pointer-events: none !important; }
    #hud > *, #photoBar > * { pointer-events: auto; }
    body:not(.s-play) #hud > *, body:not(.s-photo) #photoBar > * { pointer-events: none; }

    /* ---- loading / click to start ---- */
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; background: #221c18;
      transition: opacity 0.9s ease; z-index: 30; cursor: default;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading.tap { cursor: pointer; }
    #loading .box { text-align: center; }
    #loading .logo { font-family: var(--display); font-size: 34px; font-weight: 600; color: var(--accent); }
    #loading .title { margin-top: 10px; font-size: 16px; font-weight: 500; }
    #loading .sub { margin-top: 8px; font-size: 13px; color: var(--ink-dim); }
    #loading .bar { margin: 16px auto 0; width: 220px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    #loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
    #loading .start { margin-top: 22px; font-size: 14px; color: var(--ink); animation: breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: 0.45; } }

    /* ---- main menu ---- */
    #menu {
      background: linear-gradient(90deg, rgba(20, 14, 10, 0.72) 0%, rgba(20, 14, 10, 0.35) 34%, rgba(20, 14, 10, 0) 56%);
    }
    #menu .col { position: absolute; left: clamp(24px, 7vw, 110px); top: 50%; transform: translateY(-50%); width: min(360px, calc(100vw - 48px)); }
    #menu .logo { font-family: var(--display); font-size: clamp(40px, 6vw, 62px); font-weight: 600; line-height: 1; color: var(--accent); text-shadow: 0 4px 30px rgba(0,0,0,0.35); }
    #menu .tagline { margin: 12px 0 34px; font-size: 15px; color: var(--ink-dim); max-width: 320px; line-height: 1.5; }
    #menu nav { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
    #menu nav .btn { text-align: left; font-size: 16px; padding: 12px 18px; }
    #menu .foot { margin-top: 30px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-dim); }
    .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid var(--glass-edge); }
    .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--ink-dim); }
    .seg button.on { background: rgba(242, 181, 107, 0.28); color: var(--ink); }

    /* ---- level select ---- */
    #levels { background: rgba(18, 13, 10, 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; }
    #levels .inner { max-width: 1060px; margin: 0 auto; padding: 56px 24px 40px; }
    #levels h2 { font-family: var(--display); font-size: 32px; font-weight: 600; margin: 0 0 22px; }
    /* cards (the album) */
    .card { border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
    .card .img { aspect-ratio: 16 / 10; background: #3a2e25 center / cover no-repeat; position: relative; }
    .card .body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card .name { font-family: var(--display); font-size: 22px; font-weight: 600; }
    .card .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    /* the places: a route 1→N (solid = passed, dashed = not yet), then the picked stop's details
       (ui/menu.js renderCards) */
    .ppic { background: #3a2e25 center / cover no-repeat; position: relative; }
    .ppic .faded { position: absolute; inset: 0; background: center / cover no-repeat; filter: grayscale(0.85) brightness(0.42); }
    .ppic .lock { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(246, 236, 223, 0.72); }
    .ppic .lock svg { width: 22px; height: 22px; }
    .ppic .done { position: absolute; left: 10px; top: 10px; padding: 4px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
    .status-complete { color: var(--accent); }
    .status-progress { color: #f6d9b0; }
    .status-new, .status-locked, .status-soon { color: var(--ink-dim); }
    .route { display: flex; align-items: flex-start; margin: 0 0 18px; }
    .route .stop { width: 128px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 30px 0 0; position: relative; cursor: pointer; background: none; border: 0; }
    .route .dot { width: 84px; height: 84px; border-radius: 50%; border: 3px solid rgba(255, 240, 220, 0.22); position: relative; transition: transform 0.15s; }
    .route .stop:hover .dot { transform: scale(1.05); }
    .route .dot .ppic { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
    .route .dot .lock svg { width: 20px; height: 20px; }
    .route .dot .n { position: absolute; left: -6px; top: -6px; width: 28px; height: 28px; border-radius: 50%; background: #2a2019; border: 2px solid rgba(255, 240, 220, 0.3); display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 13px; }
    .route .st-complete .dot { border-color: var(--accent); }
    .route .st-complete .dot .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .route .here .dot { border-color: var(--accent); box-shadow: 0 0 0 6px rgba(242, 181, 107, 0.25); }
    .route .sel .dot { outline: 2px solid #fff; outline-offset: 5px; }
    .route .leg { flex: 1; min-width: 8px; height: 0; border-top: 3px dashed rgba(255, 240, 220, 0.22); margin-top: 72px; }
    .route .leg.done { border-top-style: solid; border-color: var(--accent); }
    .route .pin { position: absolute; top: 0; left: 50%; transform: translateX(-50%); padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
    .route .here::before { content: ''; position: absolute; top: 21px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--accent); }
    .route .nm { font-size: 14px; font-weight: 500; text-align: center; line-height: 1.3; margin-top: 4px; }
    .route .sm { font-size: 12px; text-align: center; }
    #levels .detail { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); border-radius: 18px; overflow: hidden; }
    #levels .detail > .ppic { aspect-ratio: 16 / 10; }
    #levels .detail .body { padding: 24px 26px; display: flex; flex-direction: column; gap: 7px; }
    #levels .detail .kick { font-size: 12.5px; color: var(--accent); }
    #levels .detail .name { font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 1.2; }
    #levels .detail .stl { font-size: 14px; }
    #levels .detail .here-note { font-size: 12.5px; color: var(--accent); display: flex; gap: 5px; align-items: center; }
    #levels .detail .here-note svg { width: 13px; height: 13px; flex: none; }
    #levels .detail .blurb { font-size: 14px; color: var(--ink-dim); line-height: 1.6; }
    #levels .detail .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    @media (max-width: 720px) {
      #levels .inner { padding: 30px 16px 28px; }
      #levels h2 { font-size: 26px; margin-bottom: 14px; }
      /* the stops shrink to fit (no sideways scroll); names and states move to the details */
      .route { margin-bottom: 14px; padding: 0 2px; }
      .route .stop { width: auto; flex: 0 1 46px; min-width: 30px; padding-top: 24px; gap: 0; }
      .route .dot { width: 100%; height: auto; aspect-ratio: 1; border-width: 2px; }
      .route .dot .n { width: 20px; height: 20px; left: -5px; top: -5px; font-size: 10.5px; border-width: 1.5px; }
      .route .dot .lock svg { width: 14px; height: 14px; }
      .route .here .dot { box-shadow: 0 0 0 4px rgba(242, 181, 107, 0.25); }
      .route .sel .dot { outline-offset: 3px; }
      .route .nm, .route .sm { display: none; }
      .route .leg { margin-top: 46px; border-top-width: 2px; min-width: 4px; }
      .route .pin { font-size: 10.5px; padding: 2px 7px; top: -2px; }
      .route .stop:first-child .pin { left: 0; transform: none; }
      .route .stop:last-child .pin { left: auto; right: 0; transform: none; }
      .route .here::before { top: 16px; border-width: 4px 4px 0; margin-left: -4px; }
      #levels .detail { grid-template-columns: 1fr; }
      #levels .detail .body { padding: 14px 16px 16px; gap: 5px; }
      #levels .detail .name { font-size: 22px; }
      #levels .detail .blurb { font-size: 13px; }
    }
    #levels .back { margin-top: 24px; }

    /* ---- album: rooms kept to look at later ---- */
    #album { background: rgba(18, 13, 10, 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; }
    #album .inner { max-width: 1060px; margin: 0 auto; padding: 56px 24px 40px; }
    #album h2 { font-family: var(--display); font-size: 32px; font-weight: 600; margin: 0 0 6px; }
    #album .sub { font-size: 13.5px; color: var(--ink-dim); margin: 0 0 22px; }
    .album-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .album-cards .card .img { aspect-ratio: 16 / 9; }
    .album-cards .card .name { font-size: 18px; }
    .album-cards .card .when { font-size: 12px; color: var(--ink-dim); }
    #album .empty { font-size: 14px; color: var(--ink-dim); padding: 24px 0; }
    #album h3 { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 34px 0 4px; }
    .card .img .sample { position: absolute; left: 10px; top: 10px; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; background: rgba(20,14,10,0.6); color: var(--ink); }
    #album .back { margin-top: 24px; }

    /* ---- modals ---- */
    .modal-wrap { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15, 11, 8, 0.45); z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .modal-wrap.open { opacity: 1; pointer-events: auto; }
    .modal { width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; border-radius: 22px; padding: 22px 24px; background: var(--glass-strong); }
    .modal h3 { font-family: var(--display); font-size: 24px; font-weight: 600; margin: 0 0 16px; }
    .modal .stack { display: flex; flex-direction: column; gap: 10px; }
    .modal .stack .btn { font-size: 15px; padding: 11px 16px; }
    .field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 12px; margin: 14px 0; font-size: 14px; }
    .field input[type=range] { grid-column: 1 / -1; }
    .field .val { color: var(--ink-dim); font-size: 12px; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .modal .note { font-size: 12px; color: var(--ink-dim); margin: 14px 0 0; }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .credits h4 { font-size: 13px; color: var(--accent); margin: 16px 0 6px; font-weight: 600; }
    .credits p, .credits li { font-size: 12.5px; color: var(--ink-dim); line-height: 1.55; margin: 0; }
    .credits ul { padding-left: 18px; margin: 0; }
    .credits a { color: var(--ink); }
    kbd { display: inline-block; min-width: 20px; padding: 1px 6px; margin: 0 1px; border-radius: 6px; border: 1px solid rgba(255,240,220,0.3); border-bottom-width: 2px; background: rgba(255,255,255,0.08); font: 600 11.5px/1.5 'IBM Plex Sans Thai', system-ui, sans-serif; text-align: center; color: var(--ink); }
    .modal .row .foot { margin-right: auto; align-self: center; font-size: 12px; color: var(--ink-dim); }
    /* how to play: the controls sheet (ui/help.js) */
    /* (2 × 2: each row stays on one line — four columns broke Thai words mid-way) */
    .modal.help { width: min(760px, calc(100vw - 32px)); }
    .help .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .help .col { border-radius: 16px; padding: 12px 16px 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-edge); }
    .help .col h4 { display: flex; justify-content: space-between; align-items: center; min-height: 34px; font-family: var(--display); font-size: 16px; font-weight: 600; margin: 0 0 4px; color: var(--accent); }
    .help .col .r { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; font-size: 13.5px; line-height: 1.5; padding: 4px 0; white-space: nowrap; }
    .help .col .r .k { color: var(--ink); }
    .help .col .r .d { color: var(--ink-dim); text-align: right; }
    .help .mouse { width: 24px; height: 34px; border-radius: 12px; border: 1.5px solid rgba(255,240,220,0.45); position: relative; overflow: hidden; flex: none; }
    .help .mouse i { position: absolute; top: 0; width: 50%; height: 14px; }
    .help .mouse .lb { left: 0; background: rgba(242,181,107,0.6); }
    .help .mouse .rb { right: 0; background: rgba(140,180,255,0.5); }
    .help .mouse .wh { left: 50%; top: 4px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: #fff; }
    @media (max-width: 620px) { .help .cols { grid-template-columns: 1fr; } .help .col .r { white-space: normal; } }
    /* the first-time welcome card */
    .modal.welcome { width: min(460px, calc(100vw - 32px)); }
    .welcome ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .welcome li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; font-size: 14px; color: var(--ink-dim); line-height: 1.55; }
    .welcome li .i { width: 34px; height: 34px; border-radius: 11px; background: rgba(242,181,107,0.2); display: grid; place-items: center; font-size: 18px; }
    .welcome li b { color: var(--ink); font-weight: 600; }

    /* ---- in-game HUD ---- */
    #hud .loc { position: absolute; left: 16px; top: 16px; padding: 10px 16px 11px; border-radius: 16px; }
    #hud .loc .name { font-family: var(--display); font-size: 18px; font-weight: 600; }
    #hud .loc .room { font-size: 12px; color: var(--ink-dim); }
    #hud .tr { position: absolute; right: 16px; top: 16px; display: flex; gap: 8px; }
    #hud .hint { position: absolute; right: 16px; bottom: 16px; font-size: 12px; color: var(--ink-dim); padding: 8px 12px; border-radius: 12px; max-width: min(420px, calc(50vw - 60px)); line-height: 1.5; }
    /* a narrow window: the hint's first clause on one line, over the tool bar (and over the
       paint colours while they show) */
    @media (max-width: 900px) {
      #hud .hint { right: auto; left: 50%; transform: translateX(-50%); bottom: 84px; max-width: calc(100vw - 32px); padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #hud .hint .rest { display: none; }
      #hud #palette:not([hidden]) ~ .hint { bottom: 148px; }
    }
    .icon-btn.q { font: 600 19px/1 var(--display); color: var(--ink); }

    /* to-do list (after Hozy's task book) */
    #hud .tasks { position: absolute; left: 16px; top: 88px; width: 272px; border-radius: 16px; padding: 12px 14px 12px; }
    #hud .tasks .head { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); margin-bottom: 8px; letter-spacing: 0.02em; }
    #hud .tasks .head .n { font-variant-numeric: tabular-nums; }
    #hud .tasks ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    #hud .tasks li { display: grid; grid-template-columns: 18px 1fr auto; column-gap: 9px; align-items: center; font-size: 13.5px; }
    #hud .tasks li .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid rgba(246,236,223,0.45); display: grid; place-items: center; color: var(--accent-ink); }
    #hud .tasks li .box svg { width: 13px; height: 13px; }
    #hud .tasks li .cnt { font-size: 11.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
    #hud .tasks li .bar { grid-column: 2 / -1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); margin-top: 4px; overflow: hidden; }
    #hud .tasks li .bar b { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
    #hud .tasks li.done .box { background: var(--accent); border-color: var(--accent); }
    #hud .tasks li.done .lbl { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: rgba(246,236,223,0.35); }
    #hud .tasks li.done .bar, #hud .tasks li.locked .bar { display: none; }
    #hud .tasks li.locked { opacity: 0.45; }
    #hud .tasks .free { margin-top: 10px; font-size: 12.5px; color: var(--accent); line-height: 1.45; }
    #hud .tasks .finish { width: 100%; margin-top: 12px; font-size: 15px; padding: 10px 14px; animation: finishGlow 2.4s ease-in-out infinite; }
    @keyframes finishGlow { 50% { box-shadow: 0 0 0 5px rgba(242,181,107,0.22); } }

    /* the title timelapse's caption: what the room behind the menu is doing */
    #demoCap { position: fixed; right: clamp(20px, 4vw, 48px); bottom: clamp(20px, 5vh, 44px); padding: 10px 18px 12px; border-radius: 16px; opacity: 0; transform: translateY(8px); transition: opacity 0.45s ease, transform 0.45s ease; pointer-events: none; z-index: 5; }
    body.s-menu #demoCap.on, body.s-replay #demoCap.on { opacity: 1; transform: none; }
    body.s-replay #replayBar { opacity: 1; }
    #replayBar { pointer-events: none !important; }
    body.s-replay #replayBar > * { pointer-events: auto; }
    #replaySkip { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); }
    body.nohud #demoCap { display: none; }
    #demoCap .lbl { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.04em; }
    #demoCap .row { display: flex; gap: 10px; align-items: baseline; margin-top: 3px; }
    #demoCap .step { font-size: 12.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
    #demoCap .what { font-family: var(--display); font-size: 20px; font-weight: 600; }

    /* the reveal: before / after with a draggable divider */
    .modal.reveal { width: min(900px, calc(100vw - 32px)); padding: 20px 22px 18px; }
    .modal.reveal h3 { margin: 0 0 2px; }
    .modal.reveal .sub { margin: 0 0 14px; font-size: 13px; color: var(--ink-dim); }
    .cmp { --x: 50%; position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; cursor: ew-resize; user-select: none; touch-action: none; background: #1a1410; }
    .cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .cmp .before { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--x)) 0 0); }
    .cmp .handle { position: absolute; top: 0; bottom: 0; left: var(--x); width: 2px; margin-left: -1px; background: rgba(255,255,255,0.9); box-shadow: 0 0 10px rgba(0,0,0,0.4); pointer-events: none; }
    .cmp .handle::after { content: '⟷'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.92); color: #3a2c20; display: grid; place-items: center; font-size: 17px; }
    .cmp .tag { position: absolute; top: 10px; padding: 4px 10px; border-radius: 10px; font-size: 12px; background: rgba(20,14,10,0.55); color: #f6ecdf; pointer-events: none; }
    .cmp .tag.l { left: 10px; }
    .cmp .tag.r { right: 10px; }
    .cmp.solo .before, .cmp.solo .handle, .cmp.solo .tag { display: none; }
    .card .img .done { position: absolute; left: 10px; top: 10px; padding: 4px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }

    /* tool bar */
    #hud .toolbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 18px; }
    #hud .toolbar .tool { position: relative; width: 50px; height: 50px; border-radius: 13px; border: 1px solid transparent; background: rgba(255,255,255,0.06); display: grid; place-items: center; cursor: pointer; color: var(--ink-dim); padding: 0; }
    #hud .toolbar .tool:hover { background: rgba(255,255,255,0.13); color: var(--ink); }
    #hud .toolbar .tool.on { background: rgba(242,181,107,0.25); border-color: rgba(242,181,107,0.6); color: var(--ink); }
    #hud .toolbar .tool svg { width: 26px; height: 26px; }
    #hud .toolbar .tool .k { position: absolute; right: 4px; bottom: 2px; font-size: 10px; color: var(--ink-dim); }

    /* roller paint colours (after Hozy's three per level) + how much paint is on the roller */
    #hud .palette { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 16px; }
    #hud .palette .pc { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); cursor: pointer; padding: 0; }
    #hud .palette .pc.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(242,181,107,0.7); }
    #hud .palette .load { width: 70px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
    #hud .palette .load b { display: block; height: 100%; background: var(--accent); transition: width 0.2s; }
    #hud .palette .lbl { font-size: 12px; color: var(--ink-dim); }

    /* "task done" banner */
    .banner {
      position: fixed; left: 50%; top: 22px; transform: translate(-50%, -12px); padding: 11px 20px; border-radius: 16px;
      font-family: var(--display); font-size: 17px; font-weight: 600; opacity: 0; pointer-events: none; z-index: 12; white-space: nowrap;
    }
    .banner.on { animation: banner 2.6s ease both; }
    @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -12px); } 10%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
    body.nohud .banner { display: none; }

    /* ---- photo mode ---- */
    #photoBar .bar {
      position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(620px, calc(100vw - 32px));
      border-radius: 20px; padding: 12px 16px 14px; display: grid; grid-template-columns: 1fr auto auto; gap: 8px 14px; align-items: center;
    }
    #photoBar .label { font-size: 12px; color: var(--ink-dim); display: flex; justify-content: space-between; }
    #photoBar .label b { color: var(--ink); font-weight: 500; }
    #photoBar .slider { grid-column: 1; }
    .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
    .ticks span { cursor: pointer; }
    .ticks span:hover { color: var(--ink); }
    #photoBar .hint { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); font-size: 12px; color: var(--ink-dim); padding: 7px 12px; border-radius: 12px; white-space: nowrap; }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 25; transition: opacity 0.5s ease-out; }
    #flash.on { opacity: 0.85; transition: none; }

    /* ---- misc ---- */
    #fade { position: fixed; inset: 0; background: #1a1411; opacity: 0; pointer-events: none; z-index: 28; transition: opacity 0.6s ease; }
    #fade.on { opacity: 1; pointer-events: auto; }
    #toast {
      position: fixed; left: 50%; top: 18px; transform: translate(-50%, -8px); padding: 8px 14px; border-radius: 12px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; z-index: 26;
    }
    #toast.on { opacity: 1; transform: translate(-50%, 0); }
    .badge {
      position: fixed; right: 16px; bottom: 16px; font-size: 11.5px; color: var(--ink-dim); z-index: 6;
      padding: 6px 10px; border-radius: 10px; font-variant-numeric: tabular-nums;
    }
    body.s-play .badge { bottom: 64px; }
    body.nohud .badge, body.nohud #devpanel { display: none; }
    /* debug (settings / ?debug): the id of the thing in hand or under the pointer, to report odd ones by */
    .dbg { position: fixed; left: 16px; bottom: 16px; z-index: 6; padding: 5px 10px; border-radius: 10px; font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--ink); pointer-events: none; user-select: text; }
    .dbg .dim { color: var(--ink-dim); }
    body.nohud .dbg { display: none; }

    /* ---- dev panel (?dev): the lighting prototype's controls ---- */
    #devpanel { position: fixed; left: 16px; bottom: 16px; width: 330px; max-width: calc(100vw - 32px); padding: 14px 16px 12px; border-radius: 18px; z-index: 7; font-size: 12px; }
    #devpanel h1 { margin: 0 0 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; }
    #devpanel.min > :not(h1) { display: none; }
    #devpanel .label { font-size: 11.5px; color: var(--ink-dim); margin: 10px 0 6px; display: flex; justify-content: space-between; }
    #devpanel .label b { color: var(--ink); font-weight: 500; }
    .swatches { display: flex; gap: 8px; }
    .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); cursor: pointer; }
    .sw.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(242,181,107,0.6); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 11.5px; padding: 4px 9px; border-radius: 999px; cursor: pointer; border: 1px solid var(--glass-edge); background: rgba(255,255,255,0.06); color: var(--ink-dim); }
    .chip.on { background: rgba(242,181,107,0.22); border-color: rgba(242,181,107,0.55); color: var(--ink); }
  </style>
</head>
<body class="s-loading">
  <div id="loading"><div class="box">
    <div class="logo" data-i18n="game.title">Dustlight</div>
    <div class="title" data-i18n="load.title"></div>
    <div class="sub" id="loadmsg" data-i18n="load.models"></div>
    <div class="bar"><i id="loadbar"></i></div>
    <div class="start" id="tapStart" hidden>คลิกที่ไหนก็ได้เพื่อเริ่ม · Click anywhere to start</div>
  </div></div>

  <!-- main menu over the live room -->
  <div id="menu" class="screen">
    <div class="col">
      <div class="logo" data-i18n="game.title"></div>
      <div class="tagline" data-i18n="game.tagline"></div>
      <nav>
        <button class="btn primary" id="mContinue" data-i18n="menu.continue"></button>
        <button class="btn" id="mPlay" data-i18n="menu.levels"></button>
        <button class="btn" id="mAlbum" data-i18n="menu.album"></button>
        <button class="btn" id="mSettings" data-i18n="menu.settings"></button>
        <button class="btn" id="mCredits" data-i18n="menu.credits"></button>
      </nav>
      <div class="foot">
        <div class="seg" id="langSeg"><button data-lang="th">ไทย</button><button data-lang="en">English</button></div>
      </div>
    </div>
  </div>

  <!-- places -->
  <div id="levels" class="screen">
    <div class="inner">
      <h2 data-i18n="levels.title"></h2>
      <div class="cards" id="cards"></div>
      <button class="btn back" id="levelsBack" data-i18n="menu.back"></button>
    </div>
  </div>

  <!-- album -->
  <div id="album" class="screen">
    <div class="inner">
      <h2 data-i18n="album.title"></h2>
      <p class="sub" data-i18n="album.sub"></p>
      <div class="album-cards" id="albumCards"></div>
      <h3 data-i18n="album.samples"></h3>
      <p class="sub" data-i18n="album.samplesSub"></p>
      <div class="album-cards" id="sampleCards"></div>
      <button class="btn back" id="albumBack" data-i18n="menu.back"></button>
    </div>
  </div>

  <!-- in-game HUD -->
  <div id="hud" class="screen">
    <div class="loc glass"><div class="name" id="locName"></div><div class="room" id="locRoom"></div></div>
    <div class="tr">
      <button class="icon-btn q" id="hudHelp" data-i18n-title="hud.help" data-i18n-aria="hud.help">?</button>
      <button class="icon-btn" id="hudPhoto" data-i18n-title="hud.photo" data-i18n-aria="hud.photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="icon-btn" id="hudPause" data-i18n-title="hud.pause" data-i18n-aria="hud.pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
      </button>
    </div>
    <div class="tasks glass" id="tasks">
      <div class="head"><span data-i18n="tasks.title"></span><span class="n" id="tasksN"></span></div>
      <ul id="taskList"></ul>
      <div class="free" id="tasksFree" hidden></div>
      <button class="btn primary finish" id="finishBtn" hidden></button>
    </div>
    <div class="palette glass" id="palette" hidden></div>
    <div class="toolbar glass" id="toolbar"></div>
    <div class="hint glass" id="hint"></div>
  </div>
  <div class="banner glass" id="banner"></div>
  <div class="glass" id="demoCap"><div class="lbl" data-i18n="demo.label"></div><div class="row"><span class="step"></span><span class="what"></span></div></div>

  <!-- the player's timelapse (replay.js): only a way out; the caption card says what's going on -->
  <div id="replayBar" class="screen"><button class="btn" id="replaySkip" data-i18n="replay.skip"></button></div>

  <!-- photo mode -->
  <div id="photoBar" class="screen">
    <div class="hint glass" data-i18n="photo.hint"></div>
    <div class="bar glass">
      <div class="slider">
        <div class="label"><span data-i18n="photo.time"></span><b id="timeName"></b></div>
        <input id="time" type="range" min="0" max="1" step="0.001" value="0.62" />
        <div class="ticks" id="ticks"></div>
      </div>
      <button class="btn primary" id="shoot" data-i18n="photo.shoot"></button>
      <button class="btn" id="photoExit" data-i18n="photo.exit"></button>
    </div>
  </div>

  <!-- modals -->
  <div class="modal-wrap" id="pauseWrap"><div class="modal">
    <h3 data-i18n="pause.title"></h3>
    <div class="stack">
      <button class="btn primary" id="pResume" data-i18n="pause.resume"></button>
      <button class="btn" id="pPhoto" data-i18n="pause.photo"></button>
      <button class="btn" id="pAlbum" data-i18n="pause.album"></button>
      <button class="btn" id="pSettings" data-i18n="menu.settings"></button>
      <button class="btn" id="pHelp" data-i18n="help.title"></button>
      <button class="btn" id="pMenu" data-i18n="pause.menu"></button>
    </div>
    <p class="note" data-i18n="pause.saved"></p>
  </div></div>

  <div class="modal-wrap" id="settingsWrap"><div class="modal">
    <h3 data-i18n="settings.title"></h3>
    <div class="field"><span data-i18n="settings.language"></span>
      <div class="seg" id="langSeg2"><button data-lang="th">ไทย</button><button data-lang="en">English</button></div></div>
    <div class="field"><span data-i18n="settings.music"></span><span class="val" id="vMusic"></span><input type="range" min="0" max="1" step="0.01" id="sMusic" /></div>
    <div class="field"><span data-i18n="settings.ambience"></span><span class="val" id="vAmbience"></span><input type="range" min="0" max="1" step="0.01" id="sAmbience" /></div>
    <div class="field"><span data-i18n="settings.sfx"></span><span class="val" id="vSfx"></span><input type="range" min="0" max="1" step="0.01" id="sSfx" /></div>
    <div class="field"><span data-i18n="settings.quality"></span>
      <div class="seg" id="qualSeg"><button data-q="low" data-i18n="settings.q.low"></button><button data-q="medium" data-i18n="settings.q.medium"></button><button data-q="high" data-i18n="settings.q.high"></button></div></div>
    <div class="field"><span data-i18n="settings.day"></span>
      <div class="seg" id="daySeg"><button data-d="auto" data-i18n="settings.day.auto"></button><button data-d="stop" data-i18n="settings.day.stop"></button></div></div>
    <div class="field"><span data-i18n="settings.fps"></span><input type="checkbox" id="sFps" /></div>
    <div class="field"><span data-i18n="settings.debug"></span><input type="checkbox" id="sDebug" /></div>
    <div class="row"><button class="btn primary" id="settingsClose" data-i18n="menu.close"></button></div>
  </div></div>

  <div class="modal-wrap" id="creditsWrap"><div class="modal credits">
    <h3 data-i18n="credits.title"></h3>
    <p data-i18n="credits.made"></p>
    <h4 data-i18n="credits.models"></h4>
    <ul id="creditModels"></ul>
    <h4 data-i18n="credits.audio"></h4>
    <ul id="creditAudio"></ul>
    <h4 data-i18n="credits.code"></h4>
    <p>three.js (MIT) · postprocessing (Zlib) · N8AO (ISC)</p>
    <h4 data-i18n="credits.fonts"></h4>
    <p>IBM Plex Sans Thai · Mali (SIL Open Font License)</p>
    <div class="row"><button class="btn primary" id="creditsClose" data-i18n="menu.close"></button></div>
  </div></div>

  <!-- how to play (ui/help.js): the controls sheet (? / H / pause) and the first-time welcome card -->
  <div class="modal-wrap" id="helpWrap"><div class="modal help">
    <h3 data-i18n="help.title"></h3>
    <div class="cols" id="helpCols"></div>
    <div class="row"><span class="foot" data-i18n="help.foot"></span><button class="btn primary" id="helpClose" data-i18n="menu.close"></button></div>
  </div></div>

  <div class="modal-wrap" id="welcomeWrap"><div class="modal welcome">
    <h3 id="welcomeTitle"></h3>
    <ol id="welcomeSteps"></ol>
    <div class="row"><span class="foot" id="welcomeKeys"></span><button class="btn primary" id="welcomeGo" data-i18n="welcome.go"></button></div>
  </div></div>

  <div class="modal-wrap" id="confirmWrap"><div class="modal">
    <p id="confirmText" style="margin:0;font-size:15px;line-height:1.5"></p>
    <div class="row"><button class="btn" id="confirmNo" data-i18n="menu.back"></button><button class="btn primary" id="confirmYes">OK</button></div>
  </div></div>

  <div class="modal-wrap" id="revealWrap"><div class="modal reveal">
    <h3 data-i18n="reveal.title"></h3>
    <p class="sub" id="revealSub"></p>
    <div class="cmp" id="cmp">
      <img id="cmpAfter" alt="" />
      <div class="before"><img id="cmpBefore" alt="" /></div>
      <div class="handle"></div>
      <span class="tag l" data-i18n="reveal.before"></span><span class="tag r" data-i18n="reveal.after"></span>
    </div>
    <div class="row">
      <button class="btn" id="rvMenu" data-i18n="pause.menu"></button>
      <button class="btn" id="rvTimelapse" data-i18n="reveal.timelapse"></button>
      <button class="btn" id="rvPhoto" data-i18n="reveal.photo"></button>
      <button class="btn primary" id="rvStay" data-i18n="reveal.stay"></button>
      <button class="btn primary" id="rvNext" hidden></button>
    </div>
  </div></div>

  <!-- dev: the lighting prototype's panel (?dev) -->
  <div class="glass" id="devpanel" hidden>
    <h1 id="devTitle">dev · lighting <span>▾</span></h1>
    <div class="label"><span>time</span><b id="devTimeName"></b></div>
    <input id="devTime" type="range" min="0" max="1" step="0.001" value="0.62" />
    <div class="label"><span>wall paint</span></div>
    <div class="swatches" id="swatches"></div>
    <div class="label"><span>layers</span></div>
    <div class="chips" id="chips">
      <button class="chip on" data-k="gi">GI</button>
      <button class="chip on" data-k="ao">AO</button>
      <button class="chip on" data-k="shafts">shafts</button>
      <button class="chip on" data-k="dust">dust</button>
      <button class="chip on" data-k="bloom">bloom</button>
    </div>
  </div>

  <div class="badge glass" id="badge" hidden></div>
  <div class="dbg glass" id="dbg" hidden></div>
  <div class="glass" id="toast"></div>
  <div id="flash"></div>
  <div id="fade"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
