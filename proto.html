<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dustlight — room viewer</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a241f; }
    body { font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; color: #f6ecdf; }
    canvas { display: block; }
    [hidden] { display: none !important; }
    .panel {
      position: fixed; left: 16px; bottom: 16px; padding: 10px 14px; border-radius: 12px;
      background: rgba(28, 22, 18, 0.62); border: 1px solid rgba(255, 240, 220, 0.14);
      display: grid; gap: 8px; min-width: 260px;
    }
    .panel b { font-size: 15px; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .row input[type=range] { flex: 1; }
    button { font: inherit; color: inherit; background: rgba(255, 240, 220, 0.1); border: 1px solid rgba(255, 240, 220, 0.2);
      border-radius: 8px; padding: 2px 10px; cursor: pointer; }
    select { font: inherit; color: inherit; background: #3a302a; border: 1px solid rgba(255, 240, 220, 0.2); border-radius: 8px; padding: 1px 6px; }
    .hint { color: rgba(246, 236, 223, 0.6); font-size: 12px; }
    #load { position: fixed; inset: 0; display: grid; place-items: center; background: #2a241f; font-size: 16px; }
    #badge { position: fixed; right: 16px; top: 16px; padding: 4px 10px; border-radius: 8px; background: rgba(28, 22, 18, 0.62); }
    body.nohud .panel, body.nohud #badge { display: none; }
  </style>
</head>
<body>
  <div id="load">loading…</div>
  <div class="panel" id="panel">
    <b id="roomName"></b>
    <div class="row"><span>time</span><input id="time" type="range" min="0" max="1" step="0.001" /><span id="timeName"></span></div>
    <div class="row"><button id="dayBtn">▶ day</button><select id="dayLen">
      <option value="40">40 s / day</option><option value="120" selected>2 min / day</option><option value="600">10 min / day</option>
    </select></div>
    <div class="row" id="cams"></div>
    <div class="hint">drag = orbit · wheel = zoom · right-drag = pan · right-click a lamp = switch it</div>
  </div>
  <div id="badge"></div>
  <script type="module" src="./src/proto.js"></script>
</body>
</html>
