# Build the game and publish it to GitHub Pages on every push to main.
# The assets aren't in git (CC0 / CC-BY works by other people): `npm run assets` downloads
# them, and the download is cached until one of the fetch scripts changes.
# One-time repo setting: Settings → Pages → Source = "GitHub Actions".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache downloaded assets
        uses: actions/cache@v4
        with:
          path: public/assets
          key: assets-${{ hashFiles('tools/fetch_*.py') }}
      - run: npm ci
      - run: npm run lint
      # re-runnable: files already in the cache are skipped
      - run: npm run assets
      # also fails if a chunk imports the entry (tools/check_chunks.mjs), then compresses the assets
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
